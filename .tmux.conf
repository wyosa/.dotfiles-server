# ── Prefix ─────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g focus-events on

# ── Splits ─────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation (vim-style) ───────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Synchronize panes (same command → all panes) ─────────
bind S setw synchronize-panes \; display "synchronize-panes: #{?pane_synchronized,on,off}"

# ── Reload ─────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ── Status bar ─────────────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left "#[fg=colour232,bg=colour39,bold] #S #[default] "
set -g status-right "#[fg=colour248] %H:%M %d-%b "
set -g status-left-length 30

# ── Pane borders (highlight the active pane) ─────────────
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
